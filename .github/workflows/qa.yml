name: Altar QA

on:
  pull_request:
  push:
    branches: [main, fix/final-altar-qa]

permissions:
  contents: read

jobs:
  test:
    # The reviewed visual baselines were captured with Chromium on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-failures
          path: test-results/
          retention-days: 7
